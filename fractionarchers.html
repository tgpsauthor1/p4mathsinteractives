<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraction Archers</title>
  <style>
    :root{
      --blue:#2563eb;--dark:#172554;--green:#16a34a;--red:#dc2626;--orange:#f59e0b;
      --ink:#1f2937;--muted:#64748b;--card:#fff;--soft:#eff6ff;--line:#cbd5e1;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#dff5ff,#fff3c4);min-height:100vh}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .top{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:12px}
    .panel{background:rgba(255,255,255,.95);border:3px solid rgba(37,99,235,.18);border-radius:22px;box-shadow:0 12px 28px rgba(15,23,42,.14)}
    .title{padding:16px 18px;display:flex;align-items:center;gap:14px}
    .logo{width:64px;height:64px;border-radius:18px;background:#dbeafe;display:grid;place-items:center;font-size:38px;border:3px solid var(--blue)}
    h1{margin:0;font-size:clamp(2rem,5vw,3.1rem);line-height:.95}.sub{margin:4px 0 0;color:var(--muted);font-weight:700}
    .stats{padding:14px;display:grid;gap:9px}.stat{display:grid;grid-template-columns:78px 1fr 44px;gap:8px;align-items:center;font-weight:800}
    .bar{height:18px;background:#e2e8f0;border:2px solid #cbd5e1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0%;transition:.25s}.energy{background:#22c55e}.shield{background:#60a5fa}.charge{background:#f59e0b}
    .layout{display:grid;grid-template-columns:1fr 280px;gap:12px}.main{min-height:610px;padding:18px}.side{padding:14px;align-self:start;position:sticky;top:12px}
    .screenTitle{font-size:clamp(1.7rem,3vw,2.25rem);margin:0 0 10px}.action{background:#dbeafe;border:3px solid var(--blue);border-radius:18px;padding:14px;font-size:clamp(1.2rem,2.3vw,1.55rem);font-weight:900;color:var(--dark);line-height:1.25;margin:12px 0}
    .qbox{background:#f8fafc;border:3px dashed var(--line);border-radius:18px;padding:16px;font-size:clamp(1.25rem,2.5vw,1.75rem);font-weight:850;line-height:1.25;margin:12px 0}.hint{background:#ffedd5;border:3px solid #fb923c;color:#7c2d12;border-radius:16px;padding:12px;margin:12px 0;font-weight:800}
    .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btn{border:0;border-radius:15px;padding:13px 17px;min-height:52px;color:#fff;background:var(--blue);font-weight:900;cursor:pointer;box-shadow:0 7px 0 #1e40af}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #1e40af}.btn.green{background:var(--green);box-shadow:0 7px 0 #15803d}.btn.gray{background:#475569;box-shadow:0 7px 0 #334155}.btn.gold{background:#d97706;box-shadow:0 7px 0 #92400e}.btn:disabled{opacity:.5;cursor:not-allowed}
    .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}.option{min-height:96px;background:#fff;border:3px solid #94a3b8;border-radius:18px;display:grid;place-items:center;font-size:1.25rem;font-weight:900;cursor:pointer;box-shadow:0 7px 0 rgba(148,163,184,.35);touch-action:manipulation}.option.sel{background:#dbeafe;border-color:var(--blue);outline:4px solid rgba(37,99,235,.18)}.option.good{background:#dcfce7;border-color:#16a34a}.option.bad{background:#fee2e2;border-color:#ef4444}
    .feedback{display:none;border-radius:16px;padding:13px;margin-top:14px;font-weight:850;line-height:1.35;border:3px solid}.feedback.show{display:block}.feedback.ok{background:#dcfce7;border-color:#16a34a;color:#14532d}.feedback.no{background:#fee2e2;border-color:#ef4444;color:#7f1d1d}.feedback.warn{background:#ffedd5;border-color:#fb923c;color:#7c2d12}
    .frac{display:inline-grid;grid-template-rows:auto 3px auto;justify-items:center;align-items:center;min-width:1.1em;margin:0 .07em;vertical-align:middle;font-weight:950;line-height:1}.frac .line{height:3px;width:100%;min-width:1.05em;background:currentColor;border-radius:99px}.frac.big{font-size:2rem}.frac.balloonFrac{font-size:1.15rem}
    .side h2{font-size:1.15rem;margin:0 0 10px}.stage{padding:9px;border-radius:13px;background:#f1f5f9;margin:7px 0;font-weight:850;display:grid;grid-template-columns:26px 1fr;gap:7px}.stage.active{background:#dbeafe;color:#172554;border:2px solid var(--blue)}.stage.done{background:#dcfce7;color:#14532d}.badge{display:inline-block;background:#ede9fe;border:2px solid #8b5cf6;color:#4c1d95;border-radius:99px;padding:7px 9px;margin:4px;font-weight:900;font-size:.86rem}.small{color:var(--muted);font-weight:700;font-size:.92rem;line-height:1.35}
    .start{text-align:center;display:grid;place-items:center;gap:18px;min-height:560px}.big{font-size:clamp(2.3rem,6vw,4.2rem);line-height:.95;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;width:100%;max-width:780px}.tile{background:#f8fafc;border:3px solid #cbd5e1;border-radius:18px;padding:16px;font-weight:850}.tile span{display:block;font-size:2rem;margin-bottom:6px}
    .numInput{width:95px;min-height:60px;border:3px solid #94a3b8;border-radius:14px;text-align:center;font-size:1.5rem;font-weight:950}.fillRow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:1.4rem;font-weight:900;margin-top:14px}.orderSlots,.orderBank{display:flex;flex-wrap:wrap;gap:10px;min-height:110px;padding:12px;border:3px dashed #94a3b8;border-radius:18px;background:#f8fafc;margin:12px 0}.slot,.card{width:128px;min-height:92px;border-radius:16px;background:#fff;border:3px solid #94a3b8;display:grid;place-items:center;position:relative;cursor:pointer}.slot:before{content:attr(data-n);position:absolute;top:4px;left:7px;font-size:.72rem;color:#64748b;font-weight:900}.card.sel{background:#dbeafe;border-color:var(--blue);outline:4px solid rgba(37,99,235,.18)}
    .bars{display:grid;gap:10px;margin-top:12px}.barRow{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;font-weight:900}.strip{display:flex;height:34px;border:3px solid #1e293b;border-radius:10px;overflow:hidden}.piece{flex:1;background:#bfdbfe;border-right:2px solid #1e293b}.piece.empty{background:#fff}.piece:last-child{border-right:0}
    .shootArea{position:relative;height:min(520px,58vh);min-height:430px;border:4px solid var(--blue);border-radius:22px;overflow:hidden;background:linear-gradient(#bfdbfe,#dcfce7);touch-action:none;user-select:none}.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#fff;border:3px solid var(--blue);border-radius:99px;padding:10px 14px;font-weight:950;z-index:30;color:#172554}.balloon{position:absolute;width:96px;height:122px;border-radius:48% 48% 45% 45%;display:grid;place-items:center;border:4px solid rgba(15,23,42,.35);box-shadow:inset -8px -12px rgba(0,0,0,.12),0 10px 14px rgba(15,23,42,.12);animation:bob 2.1s ease-in-out infinite alternate;z-index:4}.balloon:after{content:"";position:absolute;bottom:-35px;left:50%;width:2px;height:38px;background:#475569}.balloon.pop{animation:pop .42s ease forwards}@keyframes bob{from{transform:translateY(-8px)}to{transform:translateY(8px)}}@keyframes pop{to{transform:scale(1.6) rotate(18deg);opacity:0}}
    .bow{position:absolute;left:30px;bottom:72px;width:210px;height:260px;z-index:10}.bow svg{position:absolute;width:210px;height:260px;overflow:visible;pointer-events:none}.hit{position:absolute;left:60px;top:18px;width:110px;height:224px;border-radius:99px;z-index:20;cursor:grab;touch-action:none}.aim{position:absolute;left:132px;bottom:198px;width:0;height:4px;background:rgba(124,58,237,.65);transform-origin:left center;border-radius:99px;z-index:2;opacity:0}.arrow{position:absolute;width:105px;height:8px;border-radius:99px;background:#7c2d12;z-index:12;display:none;pointer-events:none}.arrow:before{content:"";position:absolute;right:-18px;top:-8px;border-left:22px solid #334155;border-top:12px solid transparent;border-bottom:12px solid transparent}.arrow:after{content:"";position:absolute;left:-18px;top:-8px;width:24px;height:24px;background:#f59e0b;clip-path:polygon(0 50%,100% 0,75% 50%,100% 100%)}
    .cloud{position:absolute;background:rgba(255,255,255,.8);width:115px;height:42px;border-radius:99px}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:52px;height:52px;top:-24px;left:22px}.cloud:after{width:44px;height:44px;top:-18px;right:18px}.c1{top:40px;left:44%}.c2{top:110px;left:72%}
    .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999}.confetti span{position:absolute;top:-20px;width:10px;height:16px;animation:fall 1s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.25}}
    @media(max-width:850px){.top,.layout{grid-template-columns:1fr}.side{position:static}.shootArea{min-height:480px;height:65vh}.bow{left:4px;transform:scale(.9);transform-origin:left bottom}.balloon{width:86px;height:112px}.main{min-height:auto}}
    @media(max-width:540px){.wrap{padding:8px}.title{padding:12px}.logo{width:52px;height:52px;font-size:32px}.options{grid-template-columns:1fr 1fr}.option{min-height:86px}.slot,.card{width:108px}.stat{grid-template-columns:72px 1fr 38px;font-size:.9rem}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <section class="panel title"><div class="logo">🏹</div><div><h1>Fraction Archers</h1><p class="sub">Answer 3 questions, charge an arrow, then pull, aim, and pop the correct balloon.</p></div></section>
      <section class="panel stats">
        <div class="stat"><span>Energy</span><div class="bar"><div id="energyFill" class="fill energy"></div></div><span id="energyText">100</span></div>
        <div class="stat"><span>Shield</span><div class="bar"><div id="shieldFill" class="fill shield"></div></div><span id="shieldText">100</span></div>
        <div class="stat"><span>Charge</span><div class="bar"><div id="chargeFill" class="fill charge"></div></div><span id="chargeText">0/3</span></div>
      </section>
    </div>
    <div class="layout">
      <main id="main" class="panel main"></main>
      <aside class="panel side"><h2>Adventure map</h2><div id="stageList"></div><h2>Arrow upgrades</h2><div id="inventory"></div><p class="small">All fractions use vertical format: numerator above the line, denominator below.</p></aside>
    </div>
  </div>

<script>
(function(){
  const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
  const state={phase:'start',stage:0,q:0,sel:null,order:[],attempts:0,energy:100,shield:100,charge:0,coins:0,done:new Set(),unlocked:[],shot:null,shuffles:{}};
  const upgrades=['Lightning','Balloon Burst','Shield','Reverse','Boss'];
  const mcq=(prompt,options,answer,fb,kind='same')=>({type:'mcq',prompt,options,answer,fb,kind});
  const fill=(prompt,left,den,num,fb)=>({type:'fill',prompt,left,den,num,fb});
  const order=(prompt,options,answer,fb)=>({type:'order',prompt,options,answer,fb});
  const stages=[
    {title:'Stage 1: Same denominator warm-up',short:'Same denominator',shoot:'Shoot the greater fraction.',target:[6,7],balloons:[[6,7],[4,7],[2,7],[5,7]],questions:[
      mcq('Which fraction is greater?',[[6,7],[4,7]],[6,7],'The denominators are the same, so compare the numerators.'),
      mcq('Which fraction is smaller?',[[3,8],[5,8]],[3,8],'Both fractions are eighths. 3 eighths is smaller than 5 eighths.'),
      mcq('Which fraction is greater?',[[9,10],[7,10]],[9,10],'Both fractions are tenths. 9 tenths is greater than 7 tenths.')
    ]},
    {title:'Stage 2: Equivalent fraction training',short:'Equivalent fractions',shoot:'Shoot the fraction equal to one-half.',target:[2,4],balloons:[[2,4],[3,4],[1,4],[2,3]],questions:[
      fill('Complete the equivalent fraction.',[1,2],6,3,'To change the denominator from 2 to 6, multiply by 3. Do the same to the numerator.'),
      fill('Complete the equivalent fraction.',[2,3],9,6,'To change the denominator from 3 to 9, multiply by 3. Do the same to the numerator.'),
      mcq('Which fraction is equal to one-half?',[[2,4],[2,3],[3,4],[1,4]],[2,4],'2 fourths is equal to 1 half. The amount is the same size.','equiv')
    ]},
    {title:'Stage 3: Compare unlike denominators',short:'Common denominator',shoot:'Shoot the greater fraction.',target:[3,4],balloons:[[3,4],[2,3],[1,4],[5,8]],questions:[
      mcq('Which fraction is greater?',[[1,2],[2,3]],[2,3],'Use sixths. 1 half is 3 sixths. 2 thirds is 4 sixths.','common'),
      mcq('Which fraction is greater?',[[3,4],[2,3]],[3,4],'Use twelfths. 3 fourths is 9 twelfths. 2 thirds is 8 twelfths.','common'),
      mcq('Which fraction is smaller?',[[2,5],[1,2]],[2,5],'Use tenths. 2 fifths is 4 tenths. 1 half is 5 tenths.','common')
    ]},
    {title:'Stage 4: Order fractions',short:'Order fractions',shoot:'Shoot the fraction that should come first in decreasing order.',target:[9,7],balloons:[[9,7],[6,7],[4,7],[2,7]],questions:[
      order('Arrange these fractions in decreasing order.',[[6,7],[4,7],[2,7],[9,7]],[[9,7],[6,7],[4,7],[2,7]],'All the denominators are 7, so compare the numerators.'),
      order('Arrange these fractions in increasing order.',[[1,4],[3,4],[2,4],[4,4]],[[1,4],[2,4],[3,4],[4,4]],'All the denominators are 4, so start with the smallest numerator.'),
      mcq('Which fraction is greatest?',[[5,6],[3,6],[7,6],[1,6]],[7,6],'All are sixths. 7 sixths has the greatest numerator.')
    ]},
    {title:'Stage 5: Boss challenge',short:'Boss challenge',shoot:'Boss round: shoot the correct answer.',target:[3,4],balloons:[[3,4],[1,2],[1,4],[5,8]],questions:[
      mcq('Which fraction is greater?',[[5,8],[3,4]],[3,4],'Use eighths. 3 fourths is 6 eighths, which is greater than 5 eighths.','common'),
      order('Arrange these fractions in decreasing order.',[[1,2],[3,4],[1,4]],[[3,4],[1,2],[1,4]],'Think in fourths: 3 fourths, 2 fourths, then 1 fourth.'),
      mcq('A student says one-half is greater than two-thirds because 2 is greater than 1. What is the mistake?',['The student compared the numbers without making equal-sized parts.','The student should always choose the smaller denominator.','The student should add the numerator and denominator.','Both fractions are equal.'],'The student compared the numbers without making equal-sized parts.','Fractions must compare equal-sized parts. 1 half is 3 sixths and 2 thirds is 4 sixths.','explain')
    ]}
  ];

  function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function f(fr,cls=''){ if(typeof fr==='string')return esc(fr); return `<span class="frac ${cls}" aria-label="${fr[0]} over ${fr[1]}"><span>${fr[0]}</span><span class="line"></span><span>${fr[1]}</span></span>`; }
  function key(x){return Array.isArray(x)?x[0]+'/'+x[1]:String(x)}
  function same(a,b){return Array.isArray(a)&&Array.isArray(b)?a[0]===b[0]&&a[1]===b[1]:String(a)===String(b)}
  function shuf(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
  function curStage(){return stages[state.stage]} function curQ(){return curStage().questions[state.q]}
  function optList(q){let k=state.stage+'-'+state.q+'-'+state.attempts;if(!state.shuffles[k])state.shuffles[k]=shuf(q.options);return state.shuffles[k]}

  function render(){stats();side(); if(state.phase==='start')start(); if(state.phase==='question')question(); if(state.phase==='shoot')shoot(); if(state.phase==='recharge')recharge(); if(state.phase==='end')end();}
  function stats(){ $('#energyFill').style.width=state.energy+'%'; $('#shieldFill').style.width=state.shield+'%'; $('#chargeFill').style.width=Math.min(100,state.charge/3*100)+'%'; $('#energyText').textContent=state.energy; $('#shieldText').textContent=state.shield; $('#chargeText').textContent=state.charge+'/3'; }
  function side(){ $('#stageList').innerHTML=stages.map((s,i)=>`<div class="stage ${state.done.has(i)?'done':''} ${i===state.stage&&state.phase!=='end'?'active':''}"><span>${state.done.has(i)?'✓':i+1}</span><span>${esc(s.short)}</span></div>`).join(''); $('#inventory').innerHTML=state.unlocked.length?state.unlocked.map(u=>`<span class="badge">🏹 ${esc(u)}</span>`).join(''):'<p class="small">Charge arrows to unlock upgrades.</p>'; }
  function start(){ $('#main').innerHTML=`<section class="start"><div><p class="big">Ready, Fraction Archer?</p><p class="sub">Practise fractions first. Shoot arrows only after your Arrow Charge Meter is full.</p></div><div class="tiles"><div class="tile"><span>🔢</span>Answer 3 fraction questions.</div><div class="tile"><span>⚡</span>Fill the Arrow Charge Meter.</div><div class="tile"><span>🎈</span>Pull, aim, and pop the correct balloon.</div><div class="tile"><span>🧠</span>Use denominators, numerators, and equivalent fractions.</div></div><button class="btn green" id="start">Start adventure</button></section>`; $('#start').onclick=()=>{state.phase='question';render()}; }
  function action(q){return q.type==='fill'?'Type the missing numerator. Then press Check.':q.type==='order'?'Tap the fractions in the correct order.':'Tap your answer. Then press Check.'}
  function promptHTML(q){ if(q.type==='fill')return `${esc(q.prompt)} ${f(q.left,'big')} = <span class="frac big"><span>?</span><span class="line"></span><span>${q.den}</span></span>`; if(q.type==='order')return esc(q.prompt); if(q.type==='mcq'){let fr=q.options.filter(Array.isArray); if(fr.length===2&&!q.prompt.includes('student'))return `${esc(q.prompt)} ${f(fr[0],'big')} or ${f(fr[1],'big')}`; return esc(q.prompt).replace('one-half',f([1,2],'big')).replace('two-thirds',f([2,3],'big'));} return esc(q.prompt); }
  function question(){let s=curStage(),q=curQ();state.sel=null;state.order=[];$('#main').innerHTML=`<h2 class="screenTitle">${esc(s.title)}</h2><div class="action">${action(q)}</div><div class="qbox">${promptHTML(q)}</div><div id="body"></div><div class="btns" id="btns"></div><div class="feedback" id="fb"></div>`; if(q.type==='mcq')renderMCQ(q); if(q.type==='fill')renderFill(q); if(q.type==='order')renderOrder(q); }
  function renderMCQ(q){let opts=optList(q);$('#body').innerHTML=(state.attempts>0&&q.kind==='common'?bars(q.options.filter(Array.isArray).slice(0,2)):'')+`<div class="options">${opts.map((o,i)=>`<button class="option" data-i="${i}">${Array.isArray(o)?f(o,'big'):esc(o)}</button>`).join('')}</div>`; $$('.option').forEach(b=>b.onclick=()=>{$$('.option').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.sel=opts[+b.dataset.i];}); controls(()=>checkMCQ(q)); }
  function renderFill(q){$('#body').innerHTML=`${state.attempts>0?'<div class="hint">Ask: what did the denominator get multiplied by? Do the same to the numerator.</div>':''}<div class="fillRow"><span>${f(q.left,'big')}</span><span>=</span><span class="frac big"><span><input id="num" class="numInput" type="number" inputmode="numeric"></span><span class="line"></span><span>${q.den}</span></span></div>`; controls(()=>checkFill(q)); }
  function renderOrder(q){let bank=optList(q);$('#body').innerHTML=`<div class="hint">Tap a fraction below to place it. Tap a placed fraction to remove it.</div><div class="orderSlots">${q.answer.map((_,i)=>`<div class="slot" data-n="${i+1}" data-i="${i}"></div>`).join('')}</div><div class="orderBank">${bank.map((o,i)=>`<button class="card" data-i="${i}">${f(o,'big')}</button>`).join('')}</div>`; $$('.card').forEach(b=>b.onclick=()=>{let x=bank[+b.dataset.i];if(state.order.some(y=>same(x,y)))return;state.order.push(x);b.classList.add('sel');paintOrder();}); $$('.slot').forEach(sl=>sl.onclick=()=>{let i=+sl.dataset.i,removed=state.order.splice(i,1)[0];if(removed){$$('.card').forEach(c=>{if(key(bank[+c.dataset.i])===key(removed))c.classList.remove('sel')});paintOrder();}}); controls(()=>checkOrder(q)); }
  function paintOrder(){ $$('.slot').forEach((sl,i)=>sl.innerHTML=state.order[i]?f(state.order[i],'big'):''); }
  function controls(fn){$('#btns').innerHTML='<button class="btn green" id="check">Check</button><button class="btn gray" id="hintBtn">Hint</button>';$('#check').onclick=fn;$('#hintBtn').onclick=showHint;}
  function bars(fracs){return `<div class="hint">Use the bars to check equal-sized parts.</div><div class="bars">${fracs.map(fr=>`<div class="barRow"><span>${f(fr)}</span><div class="strip">${Array.from({length:fr[1]},(_,i)=>`<span class="piece ${i<fr[0]?'':'empty'}"></span>`).join('')}</div></div>`).join('')}</div>`}
  function fb(type,msg){let el=$('#fb'); if(!el)return; el.className='feedback show '+type; el.innerHTML=msg;}
  function checkMCQ(q){ if(state.sel===null)return fb('warn','Choose an answer first.'); same(state.sel,q.answer)?correct(q.fb):wrong(q.kind==='common'?'Not yet. Try making common denominators so the parts are equal-sized.':q.kind==='explain'?'Not yet. The mistake is about comparing numbers without checking equal-sized parts.':'Not yet. Check the denominator and numerator carefully.'); }
  function checkFill(q){let v=$('#num').value;if(v==='')return fb('warn','Type the missing numerator first.'); +v===q.num?correct(q.fb):wrong('Not yet. Check what the denominator was multiplied by, then do the same to the numerator.');}
  function checkOrder(q){if(state.order.length!==q.answer.length)return fb('warn','Place all the fractions first.'); q.answer.every((x,i)=>same(x,state.order[i]))?correct(q.fb):wrong('Not yet. Same denominator: compare numerators. Different denominator: think of equal-sized parts.');}
  function correct(msg){state.attempts=0;state.energy=Math.min(100,state.energy+4);state.charge=Math.min(3,state.charge+1);fb('ok','Correct! '+msg+' Arrow charge: '+state.charge+'/3.');popConfetti(16);$('#check').disabled=true;setTimeout(()=>{if(state.charge>=3){unlock();state.phase='shoot';state.shot=null}else{state.q=(state.q+1)%curStage().questions.length;state.phase='question'}render();},1300)}
  function wrong(msg){state.attempts++;state.shield=Math.max(0,state.shield-10);state.energy=Math.max(0,state.energy-3);if(state.shield<=0){state.phase='recharge';setTimeout(render,500);return}fb('no',msg+' Try again.');setTimeout(render,900)}
  function showHint(){let q=curQ();state.attempts=Math.max(1,state.attempts);let h='Check: are the parts equal-sized?'; if(q.type==='fill')h='Find what the denominator was multiplied by. Do the same to the numerator.'; else if(q.type==='order')h='For same denominators, compare the numerators. For different denominators, make equal-sized parts first.'; else if(q.kind==='common')h='Make a common denominator before comparing.'; else if(q.kind==='explain')h='Ask: did the student compare equal-sized parts?'; fb('warn',h);setTimeout(render,600)}
  function unlock(){let u=upgrades[Math.min(state.stage,upgrades.length-1)]; if(!state.unlocked.includes(u))state.unlocked.push(u);}

  function shoot(){let s=curStage(); if(!state.shot)state.shot={balloons:shuf(s.balloons).map((b,i)=>({f:b,id:'b'+i})),target:s.target,pulled:false,fired:false,x:92,y:130,angle:0};let d=state.shot;$('#main').innerHTML=`<h2 class="screenTitle">Arrow charged! Shooting phase</h2><div class="action">Pull the bowstring back, aim at the correct balloon, and release.</div><div class="qbox">${esc(s.shoot)}</div><div class="shootArea" id="shootArea"><div class="cloud c1"></div><div class="cloud c2"></div><div class="toast" id="toast">Drag the string back!</div><div class="aim" id="aim"></div>${d.balloons.map((b,i)=>balloon(b,i)).join('')}<div class="arrow" id="fly"></div><div class="bow" id="bow"><svg viewBox="0 0 210 260"><path d="M142 22 C70 74 70 187 142 238" fill="none" stroke="#7c2d12" stroke-width="16" stroke-linecap="round"/><path d="M137 28 C104 93 104 167 137 232" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/><line id="sa" x1="144" y1="28" x2="92" y2="130" stroke="#111827" stroke-width="4"/><line id="sb" x1="92" y1="130" x2="144" y2="232" stroke="#111827" stroke-width="4"/><circle id="pt" cx="92" cy="130" r="12" fill="#fff" stroke="#2563eb" stroke-width="4"/><line id="ra" x1="94" y1="130" x2="178" y2="130" stroke="#7c2d12" stroke-width="8"/><polygon id="tip" points="178,130 154,116 154,144" fill="#334155"/><polygon points="82,130 59,116 65,130 59,144" fill="#f59e0b"/></svg><div class="hit" id="hit"></div></div></div><div class="feedback show warn" id="fb">You earned this shot by answering 3 questions correctly.</div>`; setupBow(); }
  function balloon(b,i){let pos=[['58%','19%','#fecaca'],['72%','48%','#fde68a'],['48%','58%','#bbf7d0'],['82%','25%','#ddd6fe']][i];return `<div class="balloon" id="${b.id}" data-frac="${key(b.f)}" style="left:${pos[0]};top:${pos[1]};background:${pos[2]};animation-delay:${i*.22}s">${f(b.f,'balloonFrac')}</div>`}
  function setupBow(){let dragging=false;const hit=$('#hit'),bow=$('#bow');function local(e){let r=bow.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function pull(x,y){x=Math.max(18,Math.min(118,x));y=Math.max(34,Math.min(228,y));$('#sa').setAttribute('x2',x);$('#sa').setAttribute('y2',y);$('#sb').setAttribute('x1',x);$('#sb').setAttribute('y1',y);$('#pt').setAttribute('cx',x);$('#pt').setAttribute('cy',y);$('#ra').setAttribute('x1',x+2);$('#ra').setAttribute('y1',y);$('#ra').setAttribute('x2',x+92);$('#ra').setAttribute('y2',y);$('#tip').setAttribute('points',`${x+98},${y} ${x+74},${y-14} ${x+74},${y+14}`);let strength=Math.max(0,(92-x)/64),ang=(130-y)*.45;$('#aim').style.opacity=strength>.22?1:0;$('#aim').style.width=(180+strength*240)+'px';$('#aim').style.transform=`rotate(${ang}deg)`;state.shot.x=x;state.shot.y=y;state.shot.angle=ang;state.shot.pulled=strength>.48;$('#toast').textContent=state.shot.pulled?'Release to fire!':'Pull back farther!'}function start(e){e.preventDefault();if(state.shot.fired)return;dragging=true;let p=local(e);pull(p.x,p.y)}function move(e){if(!dragging)return;e.preventDefault();let p=local(e);pull(p.x,p.y)}function endDrag(){if(!dragging)return;dragging=false;if(state.shot.pulled)fire();else pull(92,130)}hit.addEventListener('pointerdown',start);window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',endDrag);hit.addEventListener('touchstart',start,{passive:false});window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',endDrag);}
  function fire(){let d=state.shot;if(d.fired)return;d.fired=true;let area=$('#shootArea').getBoundingClientRect(),bow=$('#bow').getBoundingClientRect(),arr=$('#fly');let sx=bow.left-area.left+d.x+80,sy=bow.top-area.top+d.y;arr.style.left=sx+'px';arr.style.top=sy+'px';arr.style.transform=`rotate(${d.angle}deg)`;arr.style.display='block';$('#toast').textContent='Arrow away!';let target=nearestBalloon(sy,d.angle);let tr=target.getBoundingClientRect();let ex=tr.left-area.left+tr.width/2,ey=tr.top-area.top+tr.height/2;arr.animate([{transform:`translate(0,0) rotate(${d.angle}deg)`},{transform:`translate(${ex-sx}px,${ey-sy}px) rotate(${d.angle}deg)`}],{duration:620,easing:'ease-out',fill:'forwards'});setTimeout(()=>resolveShot(target),640)}
  function nearestBalloon(sy,angle){let balloons=$$('.balloon'),area=$('#shootArea').getBoundingClientRect(),distance=Math.max(520,area.width-180),want=sy+Math.tan(angle*Math.PI/180)*distance,best=balloons[0],score=1e9;balloons.forEach(b=>{let r=b.getBoundingClientRect(),cy=r.top-area.top+r.height/2,cx=r.left-area.left+r.width/2;let xWeight=Math.max(0.35,Math.min(1,(cx-180)/Math.max(1,area.width-220)));let sc=Math.abs(cy-want)*xWeight+Math.random()*8;if(sc<score){score=sc;best=b}});return best}
  function resolveShot(target){let shot=target.dataset.frac.split('/').map(Number);target.classList.add('pop');if(same(shot,curStage().target)){state.coins+=10;state.energy=Math.min(100,state.energy+8);state.shield=Math.min(100,state.shield+5);state.done.add(state.stage);fb('ok','Bullseye! You popped the correct balloon and earned 10 coins.');popConfetti(35);setTimeout(()=>{state.charge=0;state.stage++;state.q=0;state.attempts=0;state.phase=state.stage>=stages.length?'end':'question';render()},1700)}else{state.shield=Math.max(0,state.shield-8);fb('no','That was '+f(shot)+'. Check the target instruction. Try one more question to recharge.');setTimeout(()=>{state.charge=2;state.phase=state.shield<=0?'recharge':'question';render()},1700)}stats()}
  function recharge(){state.sel=null;$('#main').innerHTML=`<section class="start"><div><p class="big">Quick practice break</p><p class="sub">Answer this support question to restore Shield.</p></div><div class="action">Which is greater: ${f([3,5],'big')} or ${f([1,5],'big')}?</div><div class="options"><button class="option" data-v="3/5">${f([3,5],'big')}</button><button class="option" data-v="1/5">${f([1,5],'big')}</button></div><button class="btn green" id="rc">Check</button><div class="feedback" id="fb"></div></section>`;$$('.option').forEach(b=>b.onclick=()=>{$$('.option').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.sel=b.dataset.v});$('#rc').onclick=()=>{if(!state.sel)return fb('warn','Choose an answer first.');if(state.sel==='3/5'){state.shield=50;state.energy=Math.min(100,state.energy+15);state.attempts=0;fb('ok','Correct. Shield restored!');setTimeout(()=>{state.phase='question';render()},900)}else fb('no','Not yet. Same denominator: compare 3 and 1.')}}
  function end(){ $('#main').innerHTML=`<section class="start"><div><p class="big">🏆 You are a Fraction Archer!</p><p class="sub">You compared and ordered fractions using denominators, numerators, and equivalent fractions.</p><p class="sub">Coins earned: ${state.coins}</p></div><button class="btn gold" id="again">Play again</button></section>`;popConfetti(70);$('#again').onclick=()=>location.reload(); }
  function popConfetti(n){let c=document.createElement('div');c.className='confetti';let colors=['#f59e0b','#22c55e','#2563eb','#ef4444','#a855f7'];for(let i=0;i<n;i++){let s=document.createElement('span');s.style.left=Math.random()*100+'%';s.style.background=colors[i%colors.length];s.style.animationDelay=Math.random()*250+'ms';c.appendChild(s)}document.body.appendChild(c);setTimeout(()=>c.remove(),1300)}
  window.addEventListener('DOMContentLoaded',render);
})();
</script>
</body>
</html>
