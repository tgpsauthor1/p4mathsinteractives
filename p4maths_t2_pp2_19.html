<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P4 Maths Interactive - Possible Totals</title>
  <style>
    :root{
      --bg:#f7f9fc;
      --card:#ffffff;
      --ink:#123;
      --muted:#506070;
      --line:#d8e0ea;
      --primary:#0b5fff;
      --primary-soft:#eaf2ff;
      --accent:#ff8a00;
      --accent-soft:#fff1df;
      --good:#138a36;
      --good-soft:#e8f7ed;
      --warn:#c62828;
      --warn-soft:#fdeaea;
      --shadow:0 10px 25px rgba(12,34,56,.08);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,#f9fbff 0%, #eef4fb 100%);
      color:var(--ink);
      min-height:100vh;
    }

    button, input{
      font:inherit;
    }

    .app{
      max-width:1100px;
      margin:0 auto;
      padding:16px;
    }

    .topbar{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-badge{
      width:54px;
      height:54px;
      border-radius:16px;
      background:linear-gradient(135deg,#ffd08a,#ff9d2f);
      display:grid;
      place-items:center;
      font-size:28px;
      box-shadow:var(--shadow);
    }

    .brand h1{
      margin:0;
      font-size:28px;
      line-height:1.15;
    }

    .brand p{
      margin:2px 0 0;
      color:var(--muted);
      font-size:15px;
    }

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .tool-btn, .nav-btn, .check-btn{
      border:none;
      border-radius:14px;
      padding:12px 16px;
      min-height:48px;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
      touch-action:manipulation;
    }

    .tool-btn:hover, .nav-btn:hover, .check-btn:hover{
      transform:translateY(-1px);
    }

    .tool-btn{
      background:#fff;
      color:var(--ink);
    }

    .tool-btn.primary, .check-btn{
      background:var(--primary);
      color:#fff;
    }

    .tool-btn.secondary{
      background:#fff3e6;
      color:#8a4c00;
    }

    .tool-btn:focus-visible, .nav-btn:focus-visible, .check-btn:focus-visible,
    .option-card:focus-visible, .total-chip:focus-visible, .match-chip:focus-visible,
    .icon-btn:focus-visible, .small-btn:focus-visible{
      outline:4px solid #96baff;
      outline-offset:2px;
    }

    .question-panel{
      background:var(--card);
      border:2px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px 18px;
      margin-bottom:14px;
      display:none;
      animation:fadeIn .25s ease;
    }

    .question-panel.show{
      display:block;
    }

    .question-panel h2{
      margin:0 0 10px;
      font-size:22px;
    }

    .question-box{
      background:#f8fbff;
      border:2px dashed #c8d8ef;
      border-radius:14px;
      padding:14px;
      font-size:20px;
      line-height:1.45;
    }

    .progress-wrap{
      background:#dfe8f3;
      border-radius:999px;
      height:14px;
      overflow:hidden;
      margin-bottom:14px;
      box-shadow:inset 0 2px 5px rgba(0,0,0,.08);
    }

    .progress-bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#0b5fff,#4b86ff);
      transition:width .35s ease;
    }

    .screen-shell{
      background:var(--card);
      border:2px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .screen-header{
      padding:18px 20px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .screen-kicker{
      color:var(--primary);
      font-weight:700;
      font-size:16px;
    }

    .screen-counter{
      color:var(--muted);
      font-size:16px;
      font-weight:700;
    }

    .screen-main{
      padding:14px 20px 20px;
      display:grid;
      grid-template-columns:minmax(260px, 1fr) minmax(280px, 1.25fr);
      gap:18px;
      align-items:start;
    }

    .left-col{
      display:grid;
      gap:14px;
      align-content:start;
    }

    .action-card{
      background:var(--primary-soft);
      border:2px solid #bdd2ff;
      border-radius:20px;
      padding:18px;
      animation:slideIn .25s ease;
    }

    .action-card h2{
      margin:0;
      font-size:31px;
      line-height:1.2;
    }

    .help-card{
      background:var(--accent-soft);
      border:2px solid #ffd19f;
      border-radius:20px;
      padding:14px 16px;
    }

    .help-card h3{
      margin:0 0 8px;
      font-size:18px;
      color:#7b4d00;
    }

    .help-card p{
      margin:0;
      color:#6a5540;
      font-size:18px;
      line-height:1.35;
    }

    .visual-card, .response-card, .feedback-card{
      background:#fff;
      border:2px solid var(--line);
      border-radius:20px;
      padding:18px;
    }

    .visual-card{
      min-height:350px;
      display:flex;
      flex-direction:column;
      gap:14px;
      justify-content:flex-start;
    }

    .response-card{
      min-height:170px;
    }

    .feedback-card{
      min-height:96px;
      display:flex;
      align-items:flex-start;
      font-size:20px;
      line-height:1.35;
    }

    .feedback-card.good{
      background:var(--good-soft);
      border-color:#a8dfb8;
      color:#125c29;
    }

    .feedback-card.bad{
      background:var(--warn-soft);
      border-color:#f3b4b4;
      color:#7d1717;
    }

    .feedback-card.neutral{
      background:#f7fbff;
      border-color:#cfe0f4;
      color:#345;
    }

    .option-grid{
      display:grid;
      gap:12px;
    }

    .option-card, .total-chip, .match-chip{
      width:100%;
      border:2px solid #ccd7e7;
      border-radius:18px;
      background:#fff;
      padding:16px 18px;
      text-align:left;
      cursor:pointer;
      min-height:64px;
      box-shadow:0 4px 12px rgba(10,25,40,.05);
      transition:transform .15s ease, border-color .15s ease, background .15s ease;
      color:var(--ink);
      touch-action:manipulation;
    }

    .option-card:hover, .total-chip:hover, .match-chip:hover{
      transform:translateY(-1px);
    }

    .option-card.selected, .total-chip.selected, .match-chip.selected{
      border-color:var(--primary);
      background:#eef4ff;
      box-shadow:0 0 0 4px rgba(11,95,255,.10);
    }

    .option-card .small{
      display:block;
      margin-top:6px;
      color:var(--muted);
      font-size:15px;
    }

    .bag-visual{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      align-items:flex-end;
    }

    .bag{
      width:76px;
      height:92px;
      border-radius:18px 18px 24px 24px;
      background:linear-gradient(180deg,#ead7b6,#d5b98a);
      border:3px solid #8a6c45;
      position:relative;
      box-shadow:0 8px 12px rgba(0,0,0,.08);
      animation:popIn .3s ease both;
    }

    .bag::before{
      content:"";
      position:absolute;
      top:-8px;
      left:14px;
      right:14px;
      height:16px;
      border-radius:12px;
      background:#8a6c45;
    }

    .bag-label{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      font-size:28px;
      font-weight:700;
      color:#4e3a20;
    }

    .loose-group{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
    }

    .orange-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      max-width:240px;
    }

    .orange-dot{
      width:28px;
      height:28px;
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #ffd38a, #ff9300 65%, #d86900 100%);
      border:2px solid #b35600;
      position:relative;
      animation:bounceIn .35s ease both;
    }

    .orange-dot::after{
      content:"";
      position:absolute;
      top:-5px;
      left:12px;
      width:5px;
      height:8px;
      background:#4e8c3a;
      border-radius:5px;
      transform:rotate(15deg);
    }

    .visual-label{
      font-size:19px;
      font-weight:700;
      color:#5f4a1d;
      background:#fff4df;
      border:2px solid #f5d08b;
      border-radius:12px;
      padding:8px 12px;
      display:inline-flex;
      align-self:flex-start;
    }

    .math-line{
      font-size:22px;
      font-weight:700;
      background:#f8fbff;
      border:2px solid #dbe6f5;
      border-radius:14px;
      padding:12px 14px;
      display:inline-block;
    }

    .row-card{
      border:2px solid #d9e3f1;
      border-radius:18px;
      padding:14px;
      background:#fbfdff;
      display:grid;
      gap:12px;
      animation:fadeIn .25s ease;
    }

    .row-head{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      font-size:20px;
      font-weight:700;
    }

    .input-wrap{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:8px;
    }

    .number-input{
      width:110px;
      min-height:56px;
      border-radius:14px;
      border:2px solid #b8c8dc;
      padding:8px 12px;
      font-size:28px;
      font-weight:700;
      text-align:center;
      background:#fff;
    }

    .number-input.correct{
      border-color:var(--good);
      background:#eefaf1;
    }

    .number-input.wrong{
      border-color:var(--warn);
      background:#fff2f2;
    }

    .small-btn{
      border:none;
      border-radius:12px;
      background:#eef4ff;
      color:var(--primary);
      padding:10px 12px;
      min-height:44px;
      cursor:pointer;
      touch-action:manipulation;
    }

    .columns{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      align-items:start;
    }

    .column-box{
      border:2px solid #dae4f3;
      border-radius:18px;
      padding:14px;
      background:#fbfdff;
      min-height:180px;
    }

    .column-box h3{
      margin:0 0 12px;
      font-size:20px;
      line-height:1.25;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .total-chip{
      width:auto;
      min-width:82px;
      text-align:center;
      justify-content:center;
      font-size:24px;
      font-weight:700;
      padding:14px 16px;
    }

    .match-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .match-column{
      border:2px solid #dce6f5;
      border-radius:18px;
      padding:14px;
      background:#fbfdff;
    }

    .match-column h3{
      margin:0 0 12px;
      font-size:20px;
    }

    .match-chip{
      text-align:center;
      font-size:24px;
      font-weight:700;
      margin-bottom:10px;
    }

    .match-line{
      min-height:44px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:26px;
      font-weight:700;
      color:var(--good);
      opacity:0;
      transform:scale(.9);
      transition:opacity .25s ease, transform .25s ease;
    }

    .match-line.show{
      opacity:1;
      transform:scale(1);
    }

    .stop-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 16px;
      border-radius:999px;
      background:#fff0f0;
      border:2px solid #f3b4b4;
      color:#8b1717;
      font-size:20px;
      font-weight:700;
      animation:pulse 1.1s ease infinite;
    }

    .step-strip{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }

    .step-card{
      flex:1 1 180px;
      border:2px solid #d7e2f0;
      border-radius:18px;
      padding:14px;
      background:#fbfdff;
    }

    .step-card .num{
      width:40px;
      height:40px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--primary);
      color:#fff;
      font-weight:700;
      margin-bottom:10px;
      font-size:22px;
    }

    .step-card h4{
      margin:0 0 6px;
      font-size:19px;
    }

    .step-card p{
      margin:0;
      font-size:18px;
      line-height:1.3;
      color:#44576c;
    }

    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }

    .check-badge{
      border:2px solid #b3dfbf;
      background:#edf9f0;
      color:#155b2a;
      border-radius:16px;
      padding:12px 14px;
      font-size:18px;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .icon-btn{
      width:52px;
      height:52px;
      border:none;
      border-radius:14px;
      background:#fff;
      cursor:pointer;
      box-shadow:var(--shadow);
      touch-action:manipulation;
    }

    .nav-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:0 20px 20px;
      flex-wrap:wrap;
    }

    .nav-btn{
      background:#fff;
      color:var(--ink);
    }

    .nav-btn[disabled], .check-btn[disabled]{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }

    .check-btn{
      min-width:150px;
    }

    .nav-right{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .subtle{
      color:var(--muted);
      font-size:16px;
      line-height:1.35;
    }

    .help-reveal{
      margin-top:12px;
      border:2px dashed #f5c385;
      background:#fff7eb;
      border-radius:16px;
      padding:14px;
      animation:fadeIn .25s ease;
    }

    .help-reveal h4{
      margin:0 0 8px;
      font-size:20px;
      color:#7a4a00;
    }

    .help-reveal p, .help-reveal li{
      font-size:18px;
      line-height:1.35;
      color:#6b5331;
    }

    .help-reveal ul{
      margin:8px 0 0 22px;
      padding:0;
    }

    .finish-panel{
      margin-top:12px;
      border:2px solid #b7d7c1;
      background:#eefaf2;
      border-radius:16px;
      padding:14px;
      font-size:19px;
      color:#1a5d2e;
      animation:fadeIn .25s ease;
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @keyframes popIn{
      from{opacity:0; transform:translateY(10px) scale(.92);}
      to{opacity:1; transform:translateY(0) scale(1);}
    }

    @keyframes bounceIn{
      from{opacity:0; transform:translateY(8px) scale(.8);}
      to{opacity:1; transform:translateY(0) scale(1);}
    }

    @keyframes fadeIn{
      from{opacity:0}
      to{opacity:1}
    }

    @keyframes slideIn{
      from{opacity:0; transform:translateX(-8px)}
      to{opacity:1; transform:translateX(0)}
    }

    @keyframes pulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.03)}
    }

    @media (max-width: 860px){
      .screen-main{
        grid-template-columns:1fr;
      }
      .visual-card{
        min-height:unset;
      }
      .action-card h2{
        font-size:28px;
      }
      .question-box{
        font-size:18px;
      }
      .columns, .match-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width: 560px){
      .brand h1{font-size:24px}
      .action-card h2{font-size:24px}
      .screen-header, .screen-main, .nav-row{padding-left:14px; padding-right:14px}
      .screen-main{padding-bottom:14px}
      .feedback-card{font-size:18px}
      .number-input{width:92px; font-size:24px}
      .bag{width:66px; height:82px}
      .bag-label{font-size:24px}
      .orange-dot{width:24px; height:24px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true">🍊</div>
        <div>
          <h1>Possible Totals Interactive</h1>
          <p>Build two lists. Compare the totals. Stop at the first match.</p>
        </div>
      </div>
      <div class="toolbar">
        <button class="tool-btn" id="toggleQuestionBtn" type="button">Show question</button>
        <button class="tool-btn secondary" id="readQuestionBtn" type="button">Read question aloud</button>
        <button class="tool-btn primary" id="readPageBtn" type="button">Read page aloud</button>
        <button class="tool-btn" id="stopReadBtn" type="button">Stop reading</button>
        <button class="tool-btn" id="restartBtn" type="button">Restart</button>
      </div>
    </div>

    <div class="question-panel" id="questionPanel" aria-live="polite">
      <h2>The question</h2>
      <div class="question-box" id="questionBox"></div>
    </div>

    <div class="progress-wrap" aria-label="Progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="screen-shell" aria-live="polite">
      <div class="screen-header">
        <div>
          <div class="screen-kicker" id="screenKicker">Interactive maths</div>
          <div class="subtle" id="screenTitleSubtle">Take one step at a time.</div>
        </div>
        <div class="screen-counter" id="screenCounter">Screen 1 of 10</div>
      </div>

      <div class="screen-main">
        <div class="left-col">
          <section class="action-card" aria-labelledby="actionHeading">
            <h2 id="actionHeading"></h2>
          </section>

          <section class="help-card" aria-labelledby="helpHeading">
            <h3 id="helpHeading">Helpful reminder</h3>
            <p id="helpText"></p>
          </section>

          <section class="response-card" id="responseCard" aria-label="Response area"></section>
          <section class="feedback-card neutral" id="feedbackCard" aria-live="polite">Choose an answer, then press <strong style="margin-left:6px;">Check</strong>.</section>
        </div>

        <section class="visual-card" id="visualCard" aria-label="Visual support area"></section>
      </div>

      <div class="nav-row">
        <div class="subtle" id="navHint">Your action for this screen is shown in the blue box.</div>
        <div class="nav-right">
          <button class="check-btn" id="checkBtn" type="button">Check</button>
          <button class="nav-btn" id="nextBtn" type="button" disabled>Next</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const questionText = "Jamie has a box of oranges. If she packs all the oranges in bags of 8, she will have 6 oranges remaining. If she packs all the oranges in bags of 5, she will have 2 oranges remaining. What is the least number of oranges Jamie has in the box?";

    const screens = [
      {
        id: "r1",
        type: "mcq",
        kicker: "Screen 1",
        title: "What is the problem asking for?",
        help: "Choose the best meaning before you start solving.",
        options: [
          { id: "bags8", text: "The number of bags of 8" },
          { id: "total", text: "The least number of oranges in the box" },
          { id: "bags5", text: "The number of bags of 5" }
        ],
        correct: "total",
        feedback: {
          correct: "Yes. We need the total number of oranges, not the number of bags.",
          wrong1: "Look at the last sentence. What must we find?",
          wrong2: "The question wants the total number of oranges in the box."
        },
        explanationHTML: `
          <div class="help-reveal">
            <h4>Look carefully at the last sentence.</h4>
            <p>The problem is not asking for the number of bags. It is asking for the <strong>least number of oranges in the box</strong>.</p>
          </div>
        `
      },
      {
        id: "r2",
        type: "mcq",
        kicker: "Screen 2",
        title: "What does “6 oranges remaining” mean here?",
        help: "Think about what is left after making full bags of 8.",
        options: [
          { id: "bags", text: "6 bags are filled" },
          { id: "left", text: "6 oranges are left after full bags of 8" },
          { id: "ineach", text: "There are 6 oranges in each bag" }
        ],
        correct: "left",
        feedback: {
          correct: "Yes. The 6 are loose oranges left over.",
          wrong1: "Think: after filling full bags of 8, what is left outside the bags?",
          wrong2: "The 6 do not mean bags. They mean 6 loose oranges are still left."
        },
        explanationHTML: `
          <div class="help-reveal">
            <h4>Read the clue in two parts.</h4>
            <ul>
              <li>Full bags of 8</li>
              <li>Then 6 oranges are still left</li>
            </ul>
          </div>
        `
      },
      {
        id: "r3",
        type: "multiinput",
        kicker: "Screen 3",
        title: "First multiply. Then add 6 left.",
        help: "For each row, first find the oranges in the full bags. Then add the 6 loose oranges.",
        rows: [
          { id: "r3a", bags: 1, bagSize: 8, remainder: 6, answer: 14 },
          { id: "r3b", bags: 2, bagSize: 8, remainder: 6, answer: 22 },
          { id: "r3c", bags: 3, bagSize: 8, remainder: 6, answer: 30 }
        ],
        feedback: {

    function getScreenState(screen){
      if(!state.screenStates[screen.id]){

      return state.screenStates[screen.id];

    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text){
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 0.95;
      utter.pitch = 1;
      utter.lang = "en-SG";
      window.speechSynthesis.speak(utter);
    }

    function stopSpeaking(){
      if("speechSynthesis" in window){
        window.speechSynthesis.cancel();
      }

      return String(str)

      const sState = getScreenState(screen);

      if(screen.type === "mcq"){
        if(!sState.optionOrder){
          sState.optionOrder = shuffle(screen.options.map(opt => opt.id));
        }
        const orderedOptions = sState.optionOrder.map(id => screen.options.find(opt => opt.id === id));

          <div class="option-grid" role="radiogroup" aria-label="${escapeHTML(screen.title)}">

    function render(){
      const screen = screens[state.screenIndex];
      const sState = getScreenState(screen);
      screenKicker.textContent = screen.kicker;
      screenTitleSubtle.textContent = "Take one clear step at a time.";
      screenCounter.textContent = `Screen ${state.screenIndex + 1} of ${screens.length}`;
      actionHeading.textContent = screen.title;
      helpText.textContent = screen.help;
      navHint.textContent = "Your action for this screen is shown in the blue box.";
      progressBar.style.width = `${((state.screenIndex) / (screens.length - 1)) * 100}%`;
      questionPanel.classList.toggle("show", state.questionOpen);
      toggleQuestionBtn.textContent = state.questionOpen ? "Hide question" : "Show question";
      nextBtn.disabled = !sState.correct;
      nextBtn.textContent = state.screenIndex === screens.length - 1 ? "Done" : "Next";
      renderVisual(screen);
      renderResponse(screen);
      renderFeedback(screen);

      const screen = screens[state.screenIndex];
      const sState = getScreenState(screen);
      sState.feedbackHTML = html;
      sState.feedbackClass = kind;
      renderFeedback(screen);
    }

    function checkMCQ(screen){
      const sState = getScreenState(screen);
      if(!sState.selected){
        setFeedback("Choose one answer first.", "neutral");
        return;
      }
      if(sState.selected === screen.correct){
        sState.correct = true;
        setFeedback(screen.feedback.correct, "good");
      } else {
        sState.attempts += 1;
        const msg = sState.attempts === 1 ? screen.feedback.wrong1 : screen.feedback.wrong2;
        setFeedback(msg, "bad");
      }
      render();
    }

    function allDigitsOrBlank(str){
      return /^[0-9]+$/.test(str);
    }

    function checkMultiInput(screen){
      const sState = getScreenState(screen);
      let allFilled = true;
      let allCorrect = true;
      let allProductsCorrect = true;
      let totalsAreBagOnly = true;

      screen.rows.forEach(row => {
        const productId = `${row.id}_product`;
        const totalId = `${row.id}_total`;
        const rawProduct = String(sState.inputs[productId] || "").trim();
        const rawTotal = String(sState.inputs[totalId] || "").trim();
        const productValue = Number(rawProduct);
        const totalValue = Number(rawTotal);
        const productAnswer = row.bags * row.bagSize;

        if(!rawProduct || !allDigitsOrBlank(rawProduct)){
          allFilled = false;
          allCorrect = false;
          allProductsCorrect = false;
          sState.inputStatus[productId] = "";
        } else if(productValue === productAnswer){
          sState.inputStatus[productId] = "correct";
        } else {
          sState.inputStatus[productId] = "wrong";
          allCorrect = false;
          allProductsCorrect = false;
        }

        if(!rawTotal || !allDigitsOrBlank(rawTotal)){
          allFilled = false;
          allCorrect = false;
          sState.inputStatus[totalId] = "";
        } else if(totalValue === row.answer){
          sState.inputStatus[totalId] = "correct";
        } else {
          sState.inputStatus[totalId] = "wrong";
          allCorrect = false;
        }

        if(totalValue !== productAnswer){
          totalsAreBagOnly = false;
        }
      });

      if(!allFilled){
        setFeedback("Complete both boxes in every row.", "neutral");
        render();
        return;
      }

      if(allCorrect){
        sState.correct = true;
        setFeedback(screen.feedback.correct, "good");
      } else {
        sState.attempts += 1;
        let msg = sState.attempts === 1 ? screen.feedback.wrong1 : screen.feedback.wrong2;
        if(!allProductsCorrect){
          msg = "First multiply: number of bags × oranges in each bag. Find the oranges in the full bags before adding the ones left.";
        } else if(totalsAreBagOnly){
          msg = "Good multiplying. Now add the loose oranges to each multiplication answer.";
        }
        setFeedback(msg, "bad");
      }
      render();
    }

    function checkMatch(screen){
      const sState = getScreenState(screen);
      if(sState.matchLeft === null || sState.matchRight === null){
        setFeedback("Tap one total in each list first.", "neutral");
        return;
      }
      if(sState.matchLeft === screen.correct && sState.matchRight === screen.correct){
        sState.correct = true;
        setFeedback(screen.feedback.correct, "good");
      } else {
        sState.attempts += 1;
        const msg = sState.attempts === 1 ? screen.feedback.wrong1 : screen.feedback.wrong2;
        setFeedback(msg, "bad");
      }
      render();
    }

    function checkSingleInput(screen){
      const sState = getScreenState(screen);
      const raw = String(sState.inputs.answer || "").trim();
      if(!raw || !allDigitsOrBlank(raw)){
        setFeedback("Type your answer first.", "neutral");
        render();
        return;
      }
      const value = Number(raw);
      if(value === screen.answer){
        sState.correct = true;
        sState.inputStatus.answer = "correct";
        setFeedback(screen.feedback.correct, "good");
      } else {
        sState.attempts += 1;
        sState.inputStatus.answer = "wrong";
        const msg = sState.attempts === 1 ? screen.feedback.wrong1 : screen.feedback.wrong2;
        setFeedback(msg, "bad");
      }
      render();
    }

    function checkCurrentScreen(){
      const screen = screens[state.screenIndex];
      if(screen.type === "mcq") checkMCQ(screen);
      if(screen.type === "multiinput") checkMultiInput(screen);
      if(screen.type === "match") checkMatch(screen);
      if(screen.type === "singleinput") checkSingleInput(screen);
    }

    document.addEventListener("click", (e) => {
      const target = e.target.closest("[data-role], #toggleQuestionBtn, #readQuestionBtn, #readPageBtn, #stopReadBtn, #restartBtn, #checkBtn, #nextBtn");
      if(!target) return;

      const screen = screens[state.screenIndex];
      const sState = getScreenState(screen);

      if(target.id === "toggleQuestionBtn"){
        state.questionOpen = !state.questionOpen;
        questionPanel.classList.toggle("show", state.questionOpen);
        toggleQuestionBtn.textContent = state.questionOpen ? "Hide question" : "Show question";
        return;
      }

      if(target.id === "readQuestionBtn"){
        speak(questionText);
        return;
      }

      if(target.id === "readPageBtn"){
        const textParts = [screen.title, screen.help];
        if(state.questionOpen) textParts.push(questionText);
        const feedbackText = feedbackCard.textContent.trim();
        if(feedbackText) textParts.push(feedbackText);
        speak(textParts.join(". "));
        return;
      }

      if(target.id === "stopReadBtn"){
        stopSpeaking();
        return;
      }

      if(target.id === "restartBtn"){
        stopSpeaking();
        state.screenIndex = 0;
        state.questionOpen = false;
        state.screenStates = {};
        render();
        return;
      }

      if(target.id === "checkBtn"){
        checkCurrentScreen();
        return;
      }

      if(target.id === "nextBtn"){
        if(target.disabled) return;
        if(state.screenIndex < screens.length - 1){
          state.screenIndex += 1;
          render();
        } else {
          setFeedback("You have finished this interactive. Press Restart to try again.", "good");
          progressBar.style.width = "100%";
        }
        return;
      }

      if(target.dataset.role === "mcq-option"){
        sState.selected = target.dataset.optionId;
        render();
        return;
      }

      if(target.dataset.role === "match-left"){
        sState.matchLeft = Number(target.dataset.value);
        render();
        return;
      }

      if(target.dataset.role === "match-right"){
        sState.matchRight = Number(target.dataset.value);
        render();
        return;
      }
    });

    document.addEventListener("input", (e) => {
      const target = e.target;
      const screen = screens[state.screenIndex];
      const sState = getScreenState(screen);

      if(target.matches("[data-role='row-input']")){
        sState.inputs[target.dataset.inputId] = target.value.replace(/[^\d]/g, "");
      }

      if(target.matches("[data-role='final-input']")){
        sState.inputs.answer = target.value.replace(/[^\d]/g, "");
      }
    });

    window.addEventListener("beforeunload", () => {
      stopSpeaking();
    });

    render();
  </script>
</body>
</html>
